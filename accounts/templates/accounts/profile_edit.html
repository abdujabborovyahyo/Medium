{% extends "core/base.html" %}

{% block title %}Edit profile · MediumClone{% endblock %}

{% block content %}
<div class="page-narrow sm">
  <div class="card card-body">
    <h2 class="section-title">Edit profile</h2>
    <form method="post" enctype="multipart/form-data" class="auth-form" novalidate>
      {% csrf_token %}
      {% for field in form %}
        {% include "accounts/_field.html" %}
      {% endfor %}
      <div class="form-actions">
        <a class="btn" href="{% url 'accounts:profile' request.user.username %}">Cancel</a>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
