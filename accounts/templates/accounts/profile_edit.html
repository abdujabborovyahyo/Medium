{% extends "core/base.html" %}

{% block title %}Edit profile · MediumClone{% endblock %}

{% block content %}
<div class="container" style="max-width:640px;margin:2rem auto">
  <div class="card" style="padding:1.75rem">
    <h2 style="margin-bottom:1.25rem">Edit profile</h2>
    <form method="post" enctype="multipart/form-data" class="auth-form" novalidate>
      {% csrf_token %}
      {% for field in form %}
        {% include "accounts/_field.html" %}
      {% endfor %}
      <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:.5rem">
        <a class="btn" href="{% url 'accounts:profile' request.user.username %}">Cancel</a>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
