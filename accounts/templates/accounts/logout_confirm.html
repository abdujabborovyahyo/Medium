{% extends "core/base.html" %}
{% block title %}Log out · MediumClone{% endblock %}
{% block content %}
<div class="page-narrow sm">
  <div class="card card-body text-center">
    <h2>Log out</h2>
    <p class="hint">Are you sure you want to log out?</p>
    <form method="post">
      {% csrf_token %}
      <div class="form-actions center">
        <a href="{% url 'core:home' %}" class="btn">Cancel</a>
        <button type="submit" class="btn btn-primary">Log out</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
