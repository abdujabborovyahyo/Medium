{% extends "core/base.html" %}
{% block title %}Delete “{{ object.title }}” · MediumClone{% endblock %}
{% block content %}
<div class="page-narrow sm">
  <div class="card card-body">
    <h2>Delete article?</h2>
    <p class="hint">This will permanently remove “<strong>{{ object.title }}</strong>”. This action cannot be undone.</p>

    <form method="post">
      {% csrf_token %}
      <div class="form-actions">
        <a class="btn" href="{{ object.get_absolute_url }}">Cancel</a>
        <button type="submit" class="btn btn-danger">Delete article</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
